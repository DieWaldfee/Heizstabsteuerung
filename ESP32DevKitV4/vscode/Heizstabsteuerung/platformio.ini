[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    https://github.com/PaulStoffregen/OneWire.git  ; v2.3.7 inkompatibel mit ESP-IDF 5.x; v2.3.8 bug; git-master hat den Fix
    milesburton/DallasTemperature@4.0.4
    knolleary/PubSubClient@2.8
    marcoschwartz/LiquidCrystal_I2C@^1.1.0
    https://github.com/Savjee/EmonLib-esp32.git   ; ESP32-optimierter Fork statt openenergymonitor/EmonLib@1.1.0
    ; iakop/LiquidCrystal_I2C_ESP32@^1.1.6  ;neue Lib - muss getestet werden!
    ; uktech/emonlib-esp-idf (Component Registry)	ESP-IDF 5.x / arduino-esp32 3.x
